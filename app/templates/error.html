{% extends "base.html" %}
{% block title %}Error — {{ app_name }}{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[50vh]">
    <div class="text-center">
        <div class="text-5xl mb-4">😕</div>
        <h1 class="text-2xl font-bold mb-2">Something went wrong</h1>
        <p class="text-gray-400 mb-4">{{ error }}</p>
        <a href="/" class="inline-block px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
