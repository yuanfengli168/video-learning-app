{% extends "base.html" %}
{% block title %}Sign in — {{ app_name }}{% endblock %}
{% block breadcrumb %}Sign in{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 p-8">
            <div class="text-center mb-6">
                <div class="text-4xl mb-2">📚</div>
                <h1 class="text-2xl font-bold">Welcome to {{ app_name }}</h1>
                <p class="text-gray-400 text-sm mt-1">Sign in to start learning from videos</p>
            </div>

            <!-- AuthKit anchor -->
            <div id="auth-anchor" class="space-y-3"></div>
        </div>
    </div>
</div>

{% block scripts %}
<script type="module">
    import AuthKit from 'https://yuanfengli168.github.io/authkit/index.js';

    await AuthKit.init({
        firebase: {
            apiKey: "{{ firebase_config.apiKey }}",
            authDomain: "{{ firebase_config.authDomain }}",
            projectId: "{{ firebase_config.projectId }}",
            storageBucket: "{{ firebase_config.storageBucket }}",
            messagingSenderId: "{{ firebase_config.messagingSenderId }}",
            appId: "{{ firebase_config.appId }}",
        },
        enabledProviders: ['google', 'email'],
        anchor: '#auth-anchor',
        loginMode: 'inline',
        theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light',
        brandName: '{{ app_name }}',
        brandEmoji: '📚',
        loginTitle: 'Sign in to continue',
        loginSubtitle: 'Use Google or email to access your courses',
        googleAuthMode: 'popup',
        baseUrl: 'https://yuanfengli168.github.io/authkit/',
        redirects: {
            afterLogin: '/',
            afterLogout: '/login',
            loginPage: '/login',
        },
    });

    // Bug fix: switching accounts in the same browser.
    //
    // Symptom: login as Alice → logout → sign in as Bob → page redirects
    // back as Alice (i.e. only the FIRST account can sign in).
    //
    // Root cause: Firebase Auth uses browserLocalPersistence (IndexedDB)
    // and AuthKit re-hydrates the cached user on init. When the user
    // navigates to /login after a logout, AuthKit's first
    // onAuthStateChanged event fires with the previously-cached user.
    // Our handler then POSTs /api/auth/session with that user's token and
    // redirects to /, so the user ends up signed in as the previous
    // account even when they were trying to sign in as someone new.
    //
    // Fix: BEFORE subscribing to onAuthStateChanged, force-sign-out any
    // cached Firebase user. This makes sure onAuthStateChanged's first
    // fire is `null` (not the previous user), so the login UI stays put
    // until the user explicitly signs in. We also clear the backend
    // cookie in parallel so a stale cookie can't be reused.
    //
    // After this, the only way to get authenticated is an explicit user
    // action (clicking "Sign in with Google" / submitting the email
    // form), which is exactly what we want.
    try {
        // Clear backend cookie first (in case the previous logout's
        // DELETE didn't reach the server, e.g. browser refresh after
        // closing the tab).
        await fetch('/api/auth/session', {method: 'DELETE'});
    } catch (e) {
        console.warn('Failed to clear stale session cookie:', e);
    }
    try {
        // signOut() is a no-op if there's no cached user, so this is
        // safe to call unconditionally. It also waits for the Firebase
        // auth state to settle, which is what we need.
        if (typeof AuthKit.signOut === 'function') {
            await AuthKit.signOut();
        }
    } catch (e) {
        // signOut can throw if Firebase isn't ready yet — fall through,
        // the subsequent init will still work.
        console.warn('Pre-login signOut failed (likely already signed out):', e);
    }

    // ── Reliable sign-in completion ──
    //
    // Problem: relying on AuthKit's onAuthStateChanged to fire in the
    // PARENT window after a Google popup sign-in is unreliable. The
    // popup runs in a different browsing context, closes itself, and
    // AuthKit's onAuthStateChanged does not always fire on the parent
    // (or fires with a stale user). The user sees the popup close
    // and nothing else happens — the page never POSTs the ID token
    // to /api/auth/session.
    //
    // Fix: don't wait for onAuthStateChanged. Intercept the click on
    // the Google button and perform the Firebase sign-in directly,
    // capture the user synchronously from signInWithPopup()'s resolved
    // promise, get the ID token, and POST it. Falls back to
    // onAuthStateChanged only as a safety net for non-Google flows.
    const anchor = document.getElementById('auth-anchor');
    let signInHandled = false;

    async function handleGoogleSignInClick(clickEvent) {
        // Only intercept clicks on the Google button. Let email form
        // submissions fall through to AuthKit's normal flow.
        const target = clickEvent.target;
        const isGoogle = target && (
            target.closest('[data-provider="google"]') ||
            target.closest('button[class*="google"]') ||
            (target.textContent && target.textContent.includes('Google'))
        );
        if (!isGoogle) return;
        if (signInHandled) return;
        signInHandled = true;

        // Prevent AuthKit's own handler from also trying to sign in.
        clickEvent.preventDefault();
        clickEvent.stopImmediatePropagation();

        try {
            // Get the Firebase Auth instance. AuthKit initialises
            // Firebase internally; we need the same auth object it
            // uses. Try a few common locations.
            const auth = window.auth || (window.firebase && window.firebase.auth)
                || (AuthKit && AuthKit.auth) || (AuthKit && AuthKit._auth);
            if (!auth) {
                throw new Error('Firebase auth instance not found on window');
            }
            const { GoogleAuthProvider, signInWithPopup } =
                await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
            const provider = new GoogleAuthProvider();
            const result = await signInWithPopup(auth, provider);
            const idToken = await result.user.getIdToken();
            const resp = await fetch('/api/auth/session', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id_token: idToken}),
            });
            if (resp.ok) {
                window.location.href = '/';
            } else {
                const err = await resp.json().catch(() => ({}));
                throw new Error(err.detail || `Session POST failed: ${resp.status}`);
            }
        } catch (e) {
            console.error('Google sign-in failed:', e);
            signInHandled = false;  // allow retry
            const errEl = document.createElement('p');
            errEl.className = 'text-red-500 text-sm mt-2';
            errEl.textContent = (e.code && ERROR_TRANSLATIONS[e.code])
                || e.message
                || 'Google sign-in failed. Please try again.';
            anchor.appendChild(errEl);
        }
    }

    // Capture phase: run before AuthKit's own click handlers. The
    // anchor's children can be re-rendered by AuthKit, so we don't
    // remove this listener.
    anchor.addEventListener('click', handleGoogleSignInClick, true);

    // Safety net: if AuthKit does eventually fire onAuthStateChanged
    // (e.g. for email/password sign-in, which doesn't open a popup),
    // post the token and redirect.
    AuthKit.onAuthStateChanged(async (user) => {
        if (signInHandled) return;  // already handled via direct flow
        if (!user) return;
        try {
            const idToken = user._raw && typeof user._raw.getIdToken === 'function'
                ? await user._raw.getIdToken()
                : null;
            if (!idToken) return;
            await fetch('/api/auth/session', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id_token: idToken}),
            });
            window.location.href = '/';
        } catch (e) {
            console.error('Session POST failed (safety net):', e);
        }
    });

    // ── Friendly auth error handler ──
    //
    // Firebase errors are cryptic ("auth/internal-error") and the SDK
    // appends them as raw text into the auth-anchor. We watch for new
    // text nodes matching `Firebase: Error (...)` and rewrite them
    // into actionable messages. The MutationObserver covers both
    // Google popup and email/password failure paths because both use
    // the same anchor element.
    const ERROR_TRANSLATIONS = {
        'auth/internal-error':
            'Sign-in failed. If you used Google, check that popups are allowed for localhost. If you used email/password, ask the admin to enable Email/Password in Firebase Console → Authentication → Sign-in method.',
        'auth/popup-blocked':
            'Your browser blocked the Google sign-in popup. Please allow popups for localhost and try again.',
        'auth/popup-closed-by-user':
            'Google sign-in was cancelled. Please try again.',
        'auth/network-request-failed':
            'Network error during sign-in. Check your connection and try again.',
        'auth/invalid-email':
            'That email address is not valid.',
        'auth/missing-password':
            'Please enter a password.',
        'auth/weak-password':
            'Password must be at least 6 characters.',
        'auth/invalid-credential':
            'Wrong email or password. Please try again.',
        'auth/user-not-found':
            'No account exists for that email. Try Sign Up instead.',
        'auth/email-already-in-use':
            'That email is already registered. Try Sign In instead.',
        'auth/too-many-requests':
            'Too many failed attempts. Please wait a moment and try again.',
        'auth/cancelled-popup-request':
            'Sign-in was interrupted. Please try again.',
        'auth/unauthorized-domain':
            'This domain is not authorized for sign-in. Add localhost to the authorized domains in Firebase Console → Authentication → Settings.',
    };

    function translateAuthErrors(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        const toFix = [];
        let node;
        while ((node = walker.nextNode())) {
            const m = node.nodeValue && node.nodeValue.match(/Firebase: Error \((auth\/[a-z0-9-]+)\)/);
            if (m) toFix.push({node, code: m[1]});
        }
        for (const {node, code} of toFix) {
            node.nodeValue = ERROR_TRANSLATIONS[code] || `Sign-in failed (${code}). Please try again or contact support.`;
        }
    }

    const errorObserver = new MutationObserver((mutations) => {
        for (const m of mutations) {
            for (const n of m.addedNodes) {
                if (n.nodeType === Node.TEXT_NODE) {
                    translateAuthErrors(n.parentNode || document.body);
                } else if (n.nodeType === Node.ELEMENT_NODE) {
                    translateAuthErrors(n);
                }
            }
            // Also re-check the parent — some SDKs update an existing
            // text node's value rather than inserting a new one.
            if (m.type === 'characterData' && m.target.parentNode) {
                translateAuthErrors(m.target.parentNode);
            }
        }
    });
    errorObserver.observe(document.getElementById('auth-anchor'), {
        childList: true,
        subtree: true,
        characterData: true,
    });
</script>
{% endblock %}
{% endblock %}
