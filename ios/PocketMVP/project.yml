name: PocketMVP
options:
  bundleIdPrefix: com.shoothigh.pocketmvp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Firebase iOS SDK + GoogleSignIn via Swift Package Manager.
# Mirrors the web app's Firebase project (video-learning-app-3cf41) so the
# same user accounts work on both platforms.
#
# FirebaseAuth: email/password + Google + Apple sign-in
# FirebaseCore: shared Firebase init
# GoogleSignIn: native Google sign-in UI (vs the web's popup)
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.20.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  PocketMVP:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "Resources/sample_snapshot.json"
          - "project.yml"
          # Xcode build output + SPM bare git clones of package
          # dependencies. If included, xcodegen recursively scans them
          # and adds every `hooks/update.sample` Git template file as a
          # "resource" — and there are MANY of them with identical
          # filenames, which Xcode rejects as duplicate output files.
          # v0.2: build/ is a real directory at project root (Xcode's
          # default CONFIGURATION_BUILD_DIR). SourcePackages/ is where
          # SPM caches the raw .git dirs of dependencies.
          - "build/"
          - "PocketMVP.xcodeproj/"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      # FirebaseCore is brought in transitively by FirebaseAuth — no need
      # to depend on it explicitly. (Adding it explicitly caused Xcode
      # to complain "Missing package product 'FirebaseCore'" because
      # Xcode resolves it through FirebaseAuth's transitive closure.)
      - package: GoogleSignIn
    info:
      path: PocketMVP/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UISupportsMultipleScenes: false
        # ATS: localhost is allowlisted by default; we add this so even
        # a real iPhone (future) on the LAN can hit the dev Mac without
        # the NSAllowsArbitraryLoads hack. In v0.2 we'll add a proper
        # mkcert root CA installed on the device.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Google Sign-In: URL scheme that GoogleSignIn uses to bounce
        # back to the app after the OAuth flow. MUST match the
        # REVERSED_CLIENT_ID value from Firebase Console → GoogleService-Info.plist
        # (e.g. com.googleusercontent.apps.637126854377-XXXXXXXXX).
        # If this is wrong, GIDSignIn's OAuth callback fails silently
        # and the Safari sheet dismisses — looking like a "crash" but
        # the app just bounces back to LoginView. See LoginView.swift.
        CFBundleURLTypes:
          - CFBundleURLName: com.google.GIDURLScheme
            CFBundleURLSchemes:
              - com.googleusercontent.apps.637126854377-rs1oqqq74q3r12qs9ifjqamcs4j14thg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shoothigh.pocketmvp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "YES"
