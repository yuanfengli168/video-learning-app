name: PocketMVP
options:
  bundleIdPrefix: com.shoothigh.pocketmvp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  PocketMVP:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "Resources/sample_snapshot.json"
          - "project.yml"
    info:
      path: PocketMVP/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # ATS: localhost is allowlisted by default; we add this so even
        # a real iPhone (future) on the LAN can hit the dev Mac without
        # the NSAllowsArbitraryLoads hack. In v0.2 we'll add a proper
        # mkcert root CA installed on the device.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shoothigh.pocketmvp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "YES"
